# Isolated config for Maven/IDE tests — no real Postgres or .env required.
spring.datasource.url=jdbc:h2:mem:authproject;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

app.jwt.secret=test-secret-key-at-least-32-characters-long
app.jwt.expiration-ms=3600000
app.cache.max-size=1000
app.cache.user-ttl-seconds=600
app.otp.ttl-seconds=300
app.otp.max-attempts=3
app.async.core-pool-size=1
app.async.max-pool-size=2
app.async.queue-capacity=50
app.async.thread-name-prefix=otp-test-

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s

app.rate-limit.enabled=true
app.rate-limit.auth-limit=60
app.rate-limit.auth-window-seconds=60
app.rate-limit.login-limit=5
app.rate-limit.login-window-seconds=60
app.rate-limit.register-limit=10
app.rate-limit.register-window-seconds=3600
app.rate-limit.verify-otp-limit=10
app.rate-limit.verify-otp-window-seconds=60
app.rate-limit.resend-otp-limit=3
app.rate-limit.resend-otp-window-seconds=300
app.rate-limit.update-username-limit=5
app.rate-limit.update-username-window-seconds=604800
app.rate-limit.update-password-limit=5
app.rate-limit.update-password-window-seconds=604800
