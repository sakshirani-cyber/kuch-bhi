spring.application.name=Auth-Project

# Database credentials are loaded from .env (or OS environment variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# In-memory Caffeine cache
app.cache.ttl-minutes=${CACHE_TTL_MINUTES:30}
app.cache.max-size=${CACHE_MAX_SIZE:1000}

# JWT (override via .env)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
