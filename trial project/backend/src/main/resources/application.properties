spring.application.name=Auth-Project

# Database credentials are loaded from .env (or OS environment variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# OTP Caffeine max entries
app.cache.max-size=${CACHE_MAX_SIZE:1000}
# User profile Redis TTL (seconds)
app.cache.user-ttl-seconds=${CACHE_USER_TTL_SECONDS:600}

# Redis (user profile cache)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s

# OTP (Caffeine)
app.otp.ttl-seconds=${OTP_TTL_SECONDS:300}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:3}

# Async OTP sender thread pool
app.async.core-pool-size=${ASYNC_CORE_POOL_SIZE:2}
app.async.max-pool-size=${ASYNC_MAX_POOL_SIZE:5}
app.async.queue-capacity=${ASYNC_QUEUE_CAPACITY:100}
app.async.thread-name-prefix=${ASYNC_THREAD_NAME_PREFIX:otp-async-}

# JWT (override via .env)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Rate limiting (Redis fixed windows)
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.auth-limit=${RATE_LIMIT_AUTH:60}
app.rate-limit.auth-window-seconds=${RATE_LIMIT_AUTH_WINDOW_SECONDS:60}
app.rate-limit.login-limit=${RATE_LIMIT_LOGIN:5}
app.rate-limit.login-window-seconds=${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
app.rate-limit.register-limit=${RATE_LIMIT_REGISTER:10}
app.rate-limit.register-window-seconds=${RATE_LIMIT_REGISTER_WINDOW_SECONDS:3600}
app.rate-limit.verify-otp-limit=${RATE_LIMIT_VERIFY_OTP:10}
app.rate-limit.verify-otp-window-seconds=${RATE_LIMIT_VERIFY_OTP_WINDOW_SECONDS:60}
app.rate-limit.resend-otp-limit=${RATE_LIMIT_RESEND_OTP:3}
app.rate-limit.resend-otp-window-seconds=${RATE_LIMIT_RESEND_OTP_WINDOW_SECONDS:300}
app.rate-limit.update-username-limit=${RATE_LIMIT_UPDATE_USERNAME:5}
app.rate-limit.update-username-window-seconds=${RATE_LIMIT_UPDATE_USERNAME_WINDOW_SECONDS:604800}
app.rate-limit.update-password-limit=${RATE_LIMIT_UPDATE_PASSWORD:5}
app.rate-limit.update-password-window-seconds=${RATE_LIMIT_UPDATE_PASSWORD_WINDOW_SECONDS:604800}
