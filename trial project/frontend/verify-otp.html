<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
    <div class="card">
        <h2>Verify Email</h2>
        <div id="message"></div>

        <form id="otpForm" novalidate>
            <div class="form-group">
                <label for="email">Email <span class="required-mark" aria-hidden="true">*</span></label>
                <input type="email" id="email" name="email" placeholder="Enter Email"
                       maxlength="100" autocomplete="email" required
                       aria-describedby="emailHint emailError">
                <span class="field-hint" id="emailHint">Email used during signup</span>
                <span class="field-error" id="emailError" role="alert"></span>
            </div>

            <div class="form-group">
                <label for="otp">OTP <span class="required-mark" aria-hidden="true">*</span></label>
                <input type="text" id="otp" name="otp" placeholder="Enter 6-digit OTP"
                       inputmode="numeric" maxlength="6" autocomplete="one-time-code" required
                       aria-describedby="otpHint otpError">
                <span class="field-hint" id="otpHint">Check server logs for: Sending OTP ... to ...</span>
                <span class="field-error" id="otpError" role="alert"></span>
            </div>

            <button id="verifyBtn" type="submit" class="btn" disabled>Verify OTP</button>
        </form>

        <div class="bottom-text" style="margin-top:16px;">
            Didn’t get the code?
            <button id="resendBtn" type="button" class="btn" style="margin-top:12px;width:100%;">
                Resend OTP
            </button>
        </div>

        <div class="bottom-text">
            Already verified?
            <a href="login.html">Login</a>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/verify-otp.js"></script>

</body>
</html>
